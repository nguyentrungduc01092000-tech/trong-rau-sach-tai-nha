<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="Sơ đồ 4 cột tỉ lệ trộn đất: 5 phần đất, 3 phần xơ dừa, 2 phần phân hữu cơ, 1 phần trấu hun">
  <rect width="640" height="320" fill="#ffffff"/>
  <text x="320" y="34" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222222">Tỉ lệ trộn đất 5-3-2 (tham khảo, theo thể tích)</text>
  <!-- Cột 1: đất, 5 phần, cao 150 -->
  <rect x="60" y="90" width="100" height="150" fill="#8B5E3C"/>
  <text x="110" y="80" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222">5 phần</text>
  <text x="110" y="265" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222">Đất</text>
  <!-- Cột 2: xơ dừa, 3 phần, cao 90 -->
  <rect x="200" y="150" width="100" height="90" fill="#C89B6A"/>
  <text x="250" y="140" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222">3 phần</text>
  <text x="250" y="265" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222">Xơ dừa</text>
  <!-- Cột 3: phân hữu cơ, 2 phần, cao 60 -->
  <rect x="340" y="180" width="100" height="60" fill="#4A7C3A"/>
  <text x="390" y="170" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222">2 phần</text>
  <text x="390" y="265" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222">Phân hữu cơ</text>
  <!-- Cột 4: trấu hun, 1 phần, cao 30 -->
  <rect x="480" y="210" width="100" height="30" fill="#5B5B5B"/>
  <text x="530" y="200" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222">1 phần</text>
  <text x="530" y="265" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222222">Trấu hun</text>
  <!-- Trục đáy -->
  <line x1="40" y1="240" x2="600" y2="240" stroke="#222222" stroke-width="2"/>
  <text x="320" y="300" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555555">Sơ đồ tỉ lệ trộn đất 5-3-2 theo thể tích. Nguồn: SenAgri, mục 4.1.</text>
</svg>
