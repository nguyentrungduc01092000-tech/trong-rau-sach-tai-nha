<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Sơ đồ các lớp ủ trong thùng compost: lớp Nâu và lớp Xanh xếp xen kẽ">
  <rect width="640" height="380" fill="#ffffff"/>
  <text x="320" y="34" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222222">Các lớp ủ trong thùng compost (xếp xen kẽ)</text>
  <!-- Thùng ủ: 5 lớp, mỗi lớp cao 44, từ y=60 đến y=280 -->
  <rect x="150" y="60" width="340" height="44" fill="#A67C52"/>
  <text x="320" y="88" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Lớp Nâu</text>
  <rect x="150" y="104" width="340" height="44" fill="#5B8C3E"/>
  <text x="320" y="132" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Lớp Xanh</text>
  <rect x="150" y="148" width="340" height="44" fill="#A67C52"/>
  <text x="320" y="176" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Lớp Nâu</text>
  <rect x="150" y="192" width="340" height="44" fill="#5B8C3E"/>
  <text x="320" y="220" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Lớp Xanh</text>
  <rect x="150" y="236" width="340" height="44" fill="#A67C52"/>
  <text x="320" y="264" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Lớp Nâu</text>
  <rect x="150" y="60" width="340" height="220" fill="none" stroke="#222222" stroke-width="3"/>
  <!-- Chú giải -->
  <rect x="120" y="305" width="20" height="20" fill="#A67C52"/>
  <text x="148" y="321" font-family="sans-serif" font-size="15" fill="#222222">Nâu: lá khô, rơm rạ, giấy vụn</text>
  <rect x="380" y="305" width="20" height="20" fill="#5B8C3E"/>
  <text x="408" y="321" font-family="sans-serif" font-size="15" fill="#222222">Xanh: vỏ rau củ, bã cà phê</text>
  <text x="320" y="352" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555555">Tỉ lệ khoảng 2–3 phần Nâu : 1 phần Xanh. Hình minh họa tự vẽ.</text>
</svg>
